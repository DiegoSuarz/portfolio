<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diego | VS Code Portfolio</title>
  <link rel="stylesheet" href="src/css/style.css?v=3">
</head>
<body>

<div class="window">

  <!-- Activity Bar -->
  <nav class="activity-bar" aria-label="Portfolio sections">
    <button class="activity active" id="explorer-toggle" type="button" aria-label="Toggle Portfolio Explorer" aria-controls="portfolio-explorer" aria-expanded="true">📁</button>
    <div class="activity" aria-hidden="true">🔍</div>
    <div class="activity" aria-hidden="true">🌿</div>
  </nav>

  <!-- Sidebar -->
  <aside class="sidebar" id="portfolio-explorer" aria-label="Portfolio Explorer">
    <div class="sidebar-title">EXPLORER</div>
    <ul id="file-tree" aria-label="Portfolio files"></ul>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="tabs" id="tabs" role="tablist" aria-label="Open portfolio files"></div>

    <div class="editor">
      <div class="lines" id="lines"></div>
      <pre class="code" id="editor" tabindex="0" aria-label="Portfolio file content" aria-live="polite"></pre>
    </div>

    <div class="terminal">
      <div class="terminal-header">TERMINAL</div>
      <div class="terminal-body" id="terminal-output" role="log" aria-live="polite"></div>
      <form class="terminal-form" id="terminal-form">
        <span class="terminal-prompt" aria-hidden="true">$</span>
        <label class="sr-only" for="terminal-input">Terminal command</label>
        <input id="terminal-input" name="command" type="text" autocomplete="off" spellcheck="false" aria-describedby="terminal-hint">
        <button class="terminal-submit" type="submit" aria-label="Run command">↵</button>
        <span class="sr-only" id="terminal-hint">Enter a command. Use Arrow Up and Arrow Down to navigate command history.</span>
      </form>
    </div>
  </main>

</div>

<footer class="status-bar" aria-label="Editor status">
  <span>Ln 1, Col 1</span>
  <span>UTF-8</span>
  <span id="lang">Plain Text</span>
</footer>

<script type="module" src="src/js/app.js?v=5"></script>
</body>
</html>
